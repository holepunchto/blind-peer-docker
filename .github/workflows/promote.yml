name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release image tag to promote (e.g. v1.1.1-r1)"
        required: true
        type: string

env:
  IMAGE: docker.io/tetherto/blind-peer

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: tetherto
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Retag v1.1.1-r1 as v1, v1.1, v1.1.1 and latest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG%-r*}"
          docker buildx imagetools create \
            -t "$IMAGE:${version%%.*}" \
            -t "$IMAGE:${version%.*}" \
            -t "$IMAGE:$version" \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG"
