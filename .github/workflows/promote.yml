name: Promote Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release image tag to promote (e.g. v1.1.1-r1)"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Doesn't actually matter what we set this to, but required to be set
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag v1.1.1-r1-bare as v1, v1.1, v1.1.1, latest, v1-bare, v1.1-bare, v1.1.1-bare and latest-bare
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG%-r*}"
          docker buildx imagetools create \
            -t "$IMAGE:${version%%.*}" \
            -t "$IMAGE:${version%.*}" \
            -t "$IMAGE:$version" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${version%%.*}-bare" \
            -t "$IMAGE:${version%.*}-bare" \
            -t "$IMAGE:$version-bare" \
            -t "$IMAGE:latest-bare" \
            "$IMAGE:$TAG-bare"
      - name: Retag v1.1.1-r1-node as v1-node, v1.1-node, v1.1.1-node and latest-node
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG%-r*}"
          docker buildx imagetools create \
            -t "$IMAGE:${version%%.*}-node" \
            -t "$IMAGE:${version%.*}-node" \
            -t "$IMAGE:$version-node" \
            -t "$IMAGE:latest-node" \
            "$IMAGE:$TAG-node"
